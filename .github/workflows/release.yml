name: Build, install-test and release

# Every push and PR builds the bridge + extension and installs them on clean Windows, macOS and Linux
# runners with the same installer users run. A v* tag also publishes the GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 8
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Tag matches the package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(node -p "require('./app/native-server/package.json').version")
          e=$(node -p "require('./app/chrome-extension/package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "v$e" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME != bridge $v / extension $e"; exit 1; }

      - name: Build
        run: |
          pnpm run build:shared
          pnpm run build:native
          pnpm --filter chrome-mcp-server exec wxt prepare
          NODE_ENV=production pnpm --filter chrome-mcp-server exec wxt build

      - name: Pack
        run: node scripts/pack-release.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: release/
          if-no-files-found: error

  install-test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 24 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 20 }
    runs-on: ${{ matrix.os }}
    name: install-test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # Windows PowerShell 5.1, the shell `irm ... | iex` runs in on a stock Windows.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/install.ps1 -AssetsDir release -NoBrowser -NoClaude

      - name: Install (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --assets-dir release --no-browser --no-claude

      - name: Smoke test the installed bridge
        run: node scripts/smoke-bridge.mjs

  release:
    needs: install-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, then the install instructions.
          awk -v tag="## $GITHUB_REF_NAME" '
            index($0, tag) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ## Install

          **Windows** (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/leandrohmvieira/mcp-chrome/main/scripts/install.ps1 | iex
          ```
          **macOS / Linux**:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/leandrohmvieira/mcp-chrome/main/scripts/install.sh | bash
          ```
          Then load the extension folder the installer prints in `chrome://extensions` (Developer mode → Load unpacked).
          Full instructions: [README](https://github.com/leandrohmvieira/mcp-chrome#install).
          EOF
          gh release create "$GITHUB_REF_NAME" release/* --title "mcp-chrome $GITHUB_REF_NAME" --notes-file notes.md
